# Compiles the firmware on every push and pull request, so build errors show
# up here before anyone flashes it. Same board settings as InkDeck/sketch.yaml
# and the Arduino IDE setup (ESP32S3 Dev Module, 16 MB, OPI PSRAM).
name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # arduino/compile-sketches needs a Python that 26.04 runners lack
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,USBMode=hwcdc
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12   # what the Arduino IDE build uses
          libraries: |
            - name: GxEPD2
            - name: Adafruit GFX Library
            - name: Adafruit ST7735 and ST7789 Library
            - name: JPEGDEC
            - name: PNGdec
          sketch-paths: |
            - InkDeck
          cli-compile-flags: |
            - --warnings
            - default
          enable-warnings-report: true
